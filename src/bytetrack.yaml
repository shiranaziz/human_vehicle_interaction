# ByteTrack overrides (Ultralytics loads this file as-is — every key below is
# required; omitting a stock-default key crashes). Values marked (=stock) match
# ultralytics/cfg/trackers/bytetrack.yaml; the rest are intentional for occluded
# people next to cars (pair with config.CONF ≈ 0.15).
tracker_type: bytetrack
track_high_thresh: 0.25   # stock 0.5 — first association
track_low_thresh: 0.05    # stock 0.1 — second association floor
new_track_thresh: 0.25    # stock 0.6 — start a new track (main knob)
track_buffer: 60          # stock 30 — keep lost tracks longer
match_thresh: 0.8         # (=stock) IoU match threshold
fuse_score: True          # (=stock) fuse conf into IoU distance
