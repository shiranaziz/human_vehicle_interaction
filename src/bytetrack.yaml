# Project-local ByteTrack config (overrides Ultralytics' stock defaults).
#
# Lowered from the stock thresholds (high=0.5, new=0.6) so that occluded
# people — e.g. someone standing inside a car's bounding box — can actually
# spawn and keep a track instead of being detected and then discarded for
# lacking a track id. Pair with a modest config.CONF (~0.15).
tracker_type: bytetrack
track_high_thresh: 0.25  # threshold for the first association
track_low_thresh: 0.05   # below this a detection is ignored entirely
new_track_thresh: 0.25   # conf needed to START a new track (key knob)
track_buffer: 60         # keep lost tracks alive longer (helps FRAME_STRIDE gaps)
match_thresh: 0.8        # IoU threshold for matching tracks
fuse_score: True         # fuse conf scores with IoU distance before matching
